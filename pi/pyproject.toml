[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "beamcontrol"
version = "0.1.0"
description = "uORocketry BeamControl CAN controller"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1.6,<4",
    "python-can>=4.4,<5",
    "uvicorn>=0.35,<1",
]

[project.scripts]
beamctl = "beamcontrol.cli:main"
beamd = "beamcontrol.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beamcontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-ra"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["beamcontrol"]
