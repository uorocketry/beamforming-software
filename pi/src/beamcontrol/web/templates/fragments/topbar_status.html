<div id="topbar-status" class="status-cluster"
     data-refresh-url="/fragments/topbar" aria-label="BeamControl service status">

  <span class="service-status {{ can.health }}"><i></i><b>{{ can.channel }}</b><em>{{ can.health }}</em></span>
  <span class="service-status {{ service.health }}"><i></i><b>Boards</b><em>{{ node_summary.online }}/{{ node_summary.monitored }}</em></span>
</div>
